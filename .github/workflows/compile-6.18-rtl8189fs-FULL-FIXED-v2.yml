name: Build 6.18 Flippy + RTL8189FS

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: Kernel source owner
        required: false
        default: ophub
        type: choice
        options: [ophub, unifreq, codesnas]

      kernel_branch:
        description: Kernel source branch
        required: false
        default: main

      kernel_auto:
        description: Use latest 6.18.y
        required: false
        default: true
        type: boolean

      kernel_toolchain:
        description: Kernel toolchain
        required: false
        default: gcc-15.3
        type: choice
        options: [gcc-15.3, gcc, gcc-15.2, gcc-14.3, gcc-14.2]

      docker_image:
        description: Armbian build image
        required: false
        default: resolute
        type: choice
        options: [resolute, noble, trixie, bookworm]

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-26.04-arm

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            jq \
            tar \
            gzip \
            xz-utils \
            bc \
            bison \
            flex \
            libssl-dev \
            build-essential \
            kmod \
            dwarves

      - name: Create build disk
        run: |
          set -eux

          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$((root_avail - 4))

          [ "$root_size" -gt 0 ]

          sudo truncate -s "${root_size}G" /root.img

          build_dev=$(sudo losetup --find --show /root.img)

          sudo mkfs.xfs -f \
            -i sparse=0 \
            -b size=4096 \
            "$build_dev"

          sudo mkdir -p /builder
          sudo mount "$build_dev" /builder

          sudo chown -R runner:runner /builder

      - name: Compile 6.18 kernel
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: kernel
          kernel_source: ${{ inputs.kernel_source }}@${{ inputs.kernel_branch }}
          kernel_version: 6.18.y
          kernel_auto: ${{ inputs.kernel_auto }}
          kernel_package: all
          kernel_toolchain: ${{ inputs.kernel_toolchain }}
          kernel_config: kernel-config/release/stable
          kernel_patch: kernel-patch/beta
          auto_patch: true
          kernel_sign: -rtl8189fs
          delete_source: false
          docker_hostpath: /builder
          docker_image: ophub/armbian-${{ inputs.docker_image }}:arm64

      - name: Build RTL8189FS module against the same kernel
        if: ${{ env.PACKAGED_STATUS == 'success' }}
        shell: bash
        run: |
          set -euxo pipefail

          KSRC="$(
            find /builder \
              -type f \
              -name .config \
              -printf '%h\n' 2>/dev/null |
            grep -E '/linux-6\.18(\.y)?$|/linux-6\.18[^/]*/' |
            head -n 1 || true
          )"

          if [ -z "$KSRC" ]; then
            KSRC="$(
              find /builder \
                -type f \
                -name .config \
                -printf '%h\n' 2>/dev/null |
              head -n 1 || true
            )"
          fi

          if [ -z "$KSRC" ] || [ ! -f "$KSRC/Makefile" ]; then
            echo "Kernel source not found"
            find /builder -type f -name .config -print || true
            exit 1
          fi

          KVER="$(make -s -C "$KSRC" kernelversion)"

          echo "Using kernel source: $KSRC"
          echo "Kernel version: $KVER"

          rm -rf /builder/rtl8189fs

          git clone \
            --depth=1 \
            --branch rtl8189fs \
            https://github.com/jwrdegoede/rtl8189ES_linux.git \
            /builder/rtl8189fs

          cd /builder/rtl8189fs

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("os_dep/linux/ioctl_cfg80211.c")
          s = p.read_text()

          print("=== RTL8189FS cfg80211 compatibility patch ===")

          # ------------------------------------------------------------
          # 1. Convert old cfg80211 7.1 guards to 6.18 guards
          # ------------------------------------------------------------

          old_guard = "#if (LINUX_VERSION_CODE >= KERNEL_VERSION(7, 1, 0))"
          new_guard = "#if (LINUX_VERSION_CODE >= KERNEL_VERSION(6, 18, 0))"

          count = s.count(old_guard)

          print(f"Found {count} cfg80211 7.1 guards")

          if count:
              s = s.replace(old_guard, new_guard)

          # ------------------------------------------------------------
          # 2. remain_on_channel()
          #
          # Linux 6.18 expects:
          #
          # int (*remain_on_channel)(
          #     struct wiphy *,
          #     struct wireless_dev *,
          #     struct ieee80211_channel *,
          #     unsigned int,
          #     u64 *,
          #     const u8 *
          # );
          # ------------------------------------------------------------

          pattern = re.compile(
              r"static\s+(?:s32|int)\s+"
              r"cfg80211_rtw_remain_on_channel\s*"
              r"\(\s*"
              r"struct wiphy \*wiphy\s*,\s*"
              r"struct wireless_dev \*wdev\s*,\s*"
              r"struct ieee80211_channel \*channel\s*,\s*"
              r"unsigned int duration\s*,\s*"
              r"u64 \*cookie"
              r"(?:\s*,\s*const u8 \*rx_addr)?"
              r"\s*\)",
              re.S
          )

          replacement = """static int cfg80211_rtw_remain_on_channel(
              struct wiphy *wiphy,
              struct wireless_dev *wdev,
              struct ieee80211_channel *channel,
              unsigned int duration,
              u64 *cookie,
              const u8 *rx_addr)"""

          s, count = pattern.subn(
              replacement,
              s,
              count=1
          )

          print(f"remain_on_channel signature patches: {count}")

          if count != 1:
              raise SystemExit(
                  "ERROR: could not patch remain_on_channel signature"
              )

          # ------------------------------------------------------------
          # 3. Add compatibility wrappers for callbacks whose API changed
          # ------------------------------------------------------------

          marker = "static struct cfg80211_ops rtw_cfg80211_ops = {"

          if marker not in s:
              raise SystemExit(
                  "ERROR: cfg80211 ops table not found"
              )

          wrappers = r"""
          #if (LINUX_VERSION_CODE >= KERNEL_VERSION(6, 18, 0))

          static int rtw_compat_add_key(
              struct wiphy *wiphy,
              struct wireless_dev *wdev,
              int link_id,
              u8 key_index,
              bool pairwise,
              const u8 *mac_addr,
              struct key_params *params)
          {
              return cfg80211_rtw_add_key(
                  wiphy,
                  wdev->netdev,
                  link_id,
                  key_index,
                  pairwise,
                  mac_addr,
                  params
              );
          }

          static int rtw_compat_get_key(
              struct wiphy *wiphy,
              struct wireless_dev *wdev,
              int link_id,
              u8 key_index,
              bool pairwise,
              const u8 *mac_addr,
              void *cookie,
              void (*callback)(
                  void *cookie,
                  struct key_params *params)
          )
          {
              return cfg80211_rtw_get_key(
                  wiphy,
                  wdev->netdev,
                  link_id,
                  key_index,
                  pairwise,
                  mac_addr,
                  cookie,
                  callback
              );
          }

          static int rtw_compat_del_key(
              struct wiphy *wiphy,
              struct wireless_dev *wdev,
              int link_id,
              u8 key_index,
              bool pairwise,
              const u8 *mac_addr)
          {
              return cfg80211_rtw_del_key(
                  wiphy,
                  wdev->netdev,
                  link_id,
                  key_index,
                  pairwise,
                  mac_addr
              );
          }

          static int rtw_compat_set_default_mgmt_key(
              struct wiphy *wiphy,
              struct wireless_dev *wdev,
              int link_id,
              u8 key_index)
          {
              return cfg80211_rtw_set_default_mgmt_key(
                  wiphy,
                  wdev->netdev,
                  link_id,
                  key_index
              );
          }

          static int rtw_compat_get_station(
              struct wiphy *wiphy,
              struct wireless_dev *wdev,
              const u8 *mac,
              struct station_info *sinfo)
          {
              return cfg80211_rtw_get_station(
                  wiphy,
                  wdev->netdev,
                  mac,
                  sinfo
              );
          }

          static int rtw_compat_add_station(
              struct wiphy *wiphy,
              struct wireless_dev *wdev,
              const u8 *mac,
              struct station_parameters *params)
          {
              return cfg80211_rtw_add_station(
                  wiphy,
                  wdev->netdev,
                  mac,
                  params
              );
          }

          static int rtw_compat_del_station(
              struct wiphy *wiphy,
              struct wireless_dev *wdev,
              struct station_del_parameters *params)
          {
              return cfg80211_rtw_del_station(
                  wiphy,
                  wdev->netdev,
                  params
              );
          }

          static int rtw_compat_change_station(
              struct wiphy *wiphy,
              struct wireless_dev *wdev,
              const u8 *mac,
              struct station_parameters *params)
          {
              return cfg80211_rtw_change_station(
                  wiphy,
                  wdev->netdev,
                  mac,
                  params
              );
          }

          static int rtw_compat_dump_station(
              struct wiphy *wiphy,
              struct wireless_dev *wdev,
              int idx,
              u8 *mac,
              struct station_info *sinfo)
          {
              return cfg80211_rtw_dump_station(
                  wiphy,
                  wdev->netdev,
                  idx,
                  mac,
                  sinfo
              );
          }

          #endif
          """

          s = s.replace(
              marker,
              wrappers + "\n" + marker,
              1
          )

          # ------------------------------------------------------------
          # 4. Replace callbacks in cfg80211 ops
          # ------------------------------------------------------------

          replacements = {
              ".add_key = cfg80211_rtw_add_key,":
                  ".add_key = rtw_compat_add_key,",

              ".get_key = cfg80211_rtw_get_key,":
                  ".get_key = rtw_compat_get_key,",

              ".del_key = cfg80211_rtw_del_key,":
                  ".del_key = rtw_compat_del_key,",

              ".set_default_mgmt_key = cfg80211_rtw_set_default_mgmt_key,":
                  ".set_default_mgmt_key = rtw_compat_set_default_mgmt_key,",

              ".get_station = cfg80211_rtw_get_station,":
                  ".get_station = rtw_compat_get_station,",

              ".add_station = cfg80211_rtw_add_station,":
                  ".add_station = rtw_compat_add_station,",

              ".del_station = cfg80211_rtw_del_station,":
                  ".del_station = rtw_compat_del_station,",

              ".change_station = cfg80211_rtw_change_station,":
                  ".change_station = rtw_compat_change_station,",

              ".dump_station = cfg80211_rtw_dump_station,":
                  ".dump_station = rtw_compat_dump_station,",
          }

          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  print("patched:", old)
              else:
                  print("not present:", old)

          p.write_text(s)

          print("=== Patch complete ===")
          PY

          # ------------------------------------------------------------
          # Cross compiler
          # ------------------------------------------------------------

          export ARCH=arm64
          export KSRC="$KSRC"
          export M="$PWD"

          if command -v aarch64-none-linux-gnu-gcc >/dev/null 2>&1; then
              export CROSS_COMPILE="aarch64-none-linux-gnu-"
              export CC="${CROSS_COMPILE}gcc"
              export LD="${CROSS_COMPILE}ld.bfd"
          fi

          # ------------------------------------------------------------
          # BTF requires pahole
          # ------------------------------------------------------------

          command -v pahole

          pahole --version

          # ------------------------------------------------------------
          # Build
          # ------------------------------------------------------------

          make \
            -j"$(nproc)" \
            ARCH="$ARCH" \
            KSRC="$KSRC" \
            CONFIG_RTL8189FS=m

          # ------------------------------------------------------------
          # Find module
          # ------------------------------------------------------------

          MOD="$(
            find "$PWD" \
              -maxdepth 3 \
              -type f \
              -name '8189fs.ko' |
            head -n 1
          )"

          if [ -z "$MOD" ]; then
              echo "ERROR: 8189fs.ko was not produced"
              find "$PWD" -type f -name '*.ko' -print
              exit 1
          fi

          echo "Built module: $MOD"

          mkdir -p /builder/rtl8189fs-output

          cp -f \
            "$MOD" \
            /builder/rtl8189fs-output/8189fs.ko

          echo "RTL8189FS module ready"

          ls -lh /builder/rtl8189fs-output/8189fs.ko

      - name: Package standalone RTL8189FS module
        if: ${{ env.PACKAGED_STATUS == 'success' }}
        shell: bash
        run: |
          set -eux

          test -f /builder/rtl8189fs-output/8189fs.ko

          tar -czf \
            "${GITHUB_WORKSPACE}/rtl8189fs-module.tar.gz" \
            -C /builder/rtl8189fs-output \
            8189fs.ko

          ls -lh "${GITHUB_WORKSPACE}/rtl8189fs-module.tar.gz"

      - name: Upload kernel and RTL8189FS artifacts
        if: ${{ env.PACKAGED_STATUS == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-6.18-rtl8189fs
          path: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*
            rtl8189fs-module.tar.gz
          if-no-files-found: error

      - name: Upload to kernel_beta release
        if: ${{ env.PACKAGED_STATUS == 'success' }}
        uses: ophub/upload-to-releases@main
        with:
          tag: kernel_beta

          artifacts: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*
            rtl8189fs-module.tar.gz

          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true

          gh_token: ${{ secrets.GITHUB_TOKEN }}

          body: |
            6.18 Flippy kernel + patched RTL8189FS/FTV SDIO module

            Kernel: Linux 6.18
            Driver: RTL8189FS
            SDIO ID: 024C:F179

            Includes standalone:
            rtl8189fs-module.tar.gz
